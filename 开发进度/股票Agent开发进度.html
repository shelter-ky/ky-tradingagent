<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>股票 Agent · 开发进度</title>
<style>
:root{color-scheme:light;--paper:#f2f4f1;--ink:#172e28;--muted:#53675e;--line:#d4ded7;--green:#136c4b;--head:#133a30}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 Inter,"Microsoft YaHei UI","PingFang SC",sans-serif}
button,a{font:inherit}button{color:inherit;cursor:pointer}a{color:var(--green);text-underline-offset:3px}
button:focus-visible,a:focus-visible{outline:3px solid #148358;outline-offset:2px}
header{background:var(--head);color:#fff}.bar,main{max-width:1260px;margin:auto;padding:0 38px}.bar{min-height:62px;display:flex;align-items:center;gap:32px}.brand{font-weight:650;white-space:nowrap}.brand i{display:inline-block;vertical-align:-2px;background:linear-gradient(to top,#80e7ad 35%,transparent 35%) left/3px 100% no-repeat,linear-gradient(to top,#80e7ad 66%,transparent 66%) center/3px 100% no-repeat,linear-gradient(to top,#80e7ad 100%,transparent 100%) right/3px 100% no-repeat;width:15px;height:16px;margin-right:10px}
nav{align-self:stretch;display:flex;gap:22px}nav button{border:0;border-bottom:3px solid transparent;padding:3px 2px 0;color:#c2d7cd;background:none;font-size:14px}nav button[aria-pressed=true]{color:white;border-color:#91e8b7}.sync{margin-left:auto;font-size:12px;color:#d2e9dc}.sync:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#8ee6ad;margin-right:7px}.sync.bad:before{background:#ffc382}
main{padding-bottom:48px}.heading{margin:32px 0 24px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}.heading h1{margin:0;font-size:clamp(27px,3vw,40px);letter-spacing:-.045em;line-height:1.25}.stamp,.meta{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
#filters{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-bottom:22px}.metric{border:1px solid var(--line);background:#fafcf9;text-align:left;border-radius:10px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:6px;color:var(--muted);font-size:14px}.metric b{color:var(--ink);font:600 23px/1.1 Inter,"Segoe UI",sans-serif}.metric:hover{border-color:#76a88e}.metric[aria-pressed=true]{background:#daeede;border-color:#589471;color:#16492e}
.grid{display:grid;grid-template-columns:minmax(245px,.78fr) minmax(0,1.65fr);gap:18px;align-items:start}.box{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden}.lefthead{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.lefthead h2,.section{font-size:15px;margin:0;font-weight:650}.row{width:100%;border:0;border-bottom:1px solid #e7ede8;background:white;display:block;text-align:left;padding:11px 18px 12px;border-left:3px solid transparent}.row:last-child{border-bottom:0}.row:hover{background:#f4f8f4}.row[aria-current=true]{background:#eaf4ec;border-left-color:var(--green)}.row strong{display:block;font-size:15px;font-weight:620;margin-top:3px}.rowline,.detailtop,.eventtop{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.rowline{justify-content:space-between}
.tag{display:inline-flex;align-items:center;gap:6px;padding:1px 8px;border-radius:12px;background:#edf0ef;color:#435650;font-size:12px;white-space:nowrap}.tag:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.s1{background:#e1f0fe;color:#235d8c}.s2{background:#fff1d8;color:#82520b}.s3{background:#fbe6df;color:#943c29}.s4{background:#dcf3e5;color:#21623d}
#detail{padding:24px 28px}.detailtop{justify-content:space-between}#detail h2{font-size:clamp(21px,2.45vw,30px);letter-spacing:-.03em;line-height:1.32;margin:11px 0 8px}.lead{margin:0 0 17px;line-height:1.75}.facts{background:#f4f7f2;border-radius:10px;padding:5px 15px;margin:0}.facts div{padding:10px 0;display:grid;grid-template-columns:78px 1fr;gap:12px}.facts div+div{border-top:1px solid #dce5dc}.facts dt{color:#3d5d4e;font-size:13px;font-weight:600}.facts dd{margin:0;font-size:14px;overflow-wrap:anywhere}.section{margin:17px 0 8px}.evidence{display:flex;flex-wrap:wrap;gap:6px 16px}.evidence a{font-size:13px}.timeline{margin:8px 0 0;padding:0;list-style:none}.timeline li{border-left:2px solid #dce7df;position:relative;margin-left:4px;padding:0 0 15px 17px}.timeline li:before{content:"";position:absolute;left:-5px;top:8px;width:8px;height:8px;border-radius:50%;background:#77a488}.timeline li:last-child{padding-bottom:3px}.timeline p{font-size:14px;margin:4px 0 0}.eventtop .meta{font-size:12px}.foot{margin:17px 0 0;font-size:11px;color:var(--muted)}
#activity{padding:20px 25px}.jump{color:var(--green);background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:14px}.empty,#warning{padding:14px 18px;color:var(--muted);margin:0}#warning{background:#ffedcf;margin:12px 0;border-radius:8px;color:#723d13}[hidden]{display:none!important}
@media(max-width:820px){.bar,main{padding-left:16px;padding-right:16px}.bar{gap:18px}.grid{grid-template-columns:minmax(200px,.8fr) minmax(0,1.6fr);gap:10px}#detail{padding:18px}.metric{padding:10px}.facts div{grid-template-columns:1fr;gap:2px}}
@media(max-width:640px){.bar{min-height:54px;gap:15px}nav{gap:12px}.sync{font-size:11px}.heading{margin:22px 0 16px;display:block}.stamp{display:block;margin-top:6px}#filters{grid-template-columns:repeat(3,1fr);margin-bottom:12px}.grid{grid-template-columns:1fr}.row{padding:9px 14px}#tasks{max-height:245px;overflow:auto}#detail{scroll-margin:8px}.section{margin-top:14px}}
</style>
<link rel="stylesheet" href="./功能树.css">
</head>
<body>
<header><div class="bar"><span class="brand"><i aria-hidden="true"></i>股票 Agent</span>
<nav aria-label="面板视图"><button id="mapTab" type="button" aria-pressed="true">功能树</button><button id="overview" type="button" aria-pressed="false">任务看板</button><button id="feed" type="button" aria-pressed="false">项目动态</button></nav>
<span id="sync" class="sync">读取中</span></div></header>
<main><div class="heading"><h1 id="pageTitle">Agent 功能树</h1><span id="stamp" class="stamp"></span></div>
<p id="warning" role="status" hidden></p>
<div class="tree-layout" id="featureTree">
<section class="tree-map" aria-label="股票 Agent 功能结构">
  <div class="tree-root"><span class="root-icon" aria-hidden="true"><i></i></span><div><h2>股票 Agent</h2><p id="treeSize"></p></div></div>
  <div class="branches" id="branches"></div>
</section>
<article class="box module-detail" id="moduleDetail" aria-label="模块详情"></article>
</div>
<div id="board" hidden><div id="filters" aria-label="按状态筛选"></div>
<div class="grid"><aside class="box"><div class="lefthead"><h2>工作项</h2><span id="count" class="meta"></span></div><div id="tasks"></div></aside>
<article class="box" id="detail" aria-label="任务详情"></article></div></div>
<section class="box" id="activity" aria-label="项目动态" hidden></section>
</main>
<script src="./功能树.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const states = ["待开发","开发中","待验证","受阻","已完成"];
const priority = ["开发中","受阻","待验证","待开发","已完成"];
let tasks = [], revision = -1, selected = "", filter = "全部", view = "tree", activeModule = "regular";
function readLocation(){
  const hash = location.hash.slice(1);
  if (!hash || hash === "tree" || hash.startsWith("tree/")) {
    view = "tree";
    try {activeModule = decodeURIComponent(hash.slice(5)) || "regular"} catch {activeModule = "regular"}
    if(activeModule==="risk")activeModule="intraday";
  } else if (hash === "feed") {
    view = "feed";
  } else {
    view = "board"; filter = "全部";
    if(hash !== "board") selected = hash;
  }
}
function setLocation(hash){history.replaceState(null,"","#"+hash)}
function el(tag, text, cls) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (cls) node.className = cls;
  return node;
}
function tag(state){return el("span",state,"tag s"+states.indexOf(state))}
function formatTime(time){return time.length===10 ? time : time.slice(0,16).replace("T"," ")}
function empty(parent,text){parent.append(el("p",text,"empty"))}
function choose(key, scroll=false){
  selected=key; setLocation(encodeURIComponent(key)); render();
  if(scroll && matchMedia("(max-width:640px)").matches) $("detail").scrollIntoView({block:"start"});
}
function renderFilters(){
  const area=$("filters");area.replaceChildren();
  for(const s of ["全部",...states]){
    const b=el("button",undefined,"metric"); b.type="button";b.setAttribute("aria-pressed",String(filter===s));
    b.append(el("span",s),el("b",String(s==="全部"?tasks.length:tasks.filter(t=>t.state===s).length)));
    b.onclick=()=>{filter=s;render();$("filters").querySelector('[aria-pressed=true]').focus()};area.append(b);
  }
}
function renderTimeline(events, withTitles){
  const list=el("ol",undefined,"timeline");
  for(const e of events){
    const li=el("li"),top=el("div",undefined,"eventtop");
    top.append(el("time",formatTime(e.time),"meta"),tag(e.state));
    if(e.historical) top.append(el("span","历史补录","meta"));
    if(withTitles){
      const b=el("button",e.task.title,"jump"); b.onclick=()=>{filter="全部";view="board";choose(e.task.id,true)};top.append(b);
    }
    li.append(top,el("p",e.note));list.append(li);
  }
  return list;
}
function renderDetail(t){
  const d=$("detail");d.replaceChildren();if(!t){empty(d,"选中一个有记录的状态即可查看详情。");return}
  const top=el("div",undefined,"detailtop"); top.append(el("span",t.group,"meta"),tag(t.state));
  d.append(top,el("h2",t.title),el("p",t.note,"lead"));
  const facts=el("dl",undefined,"facts");
  for(const [label,value] of [["问题或需求",t.issue],["处理办法",t.next],["验收依据",t.check]]){
    if(value){const row=el("div");row.append(el("dt",label),el("dd",value));facts.append(row)}
  }
  if(facts.children.length)d.append(facts);
  if(t.links.length){
    d.append(el("h3","相关证据","section"));const links=el("div",undefined,"evidence");
    for(const link of t.links){
      if(!link.url.startsWith("file:///"))continue;
      const a=el("a",link.label+" ↗");a.href=link.url;a.target="_blank";a.rel="noopener";links.append(a);
    }
    d.append(links);
  }
  d.append(el("h3","进展记录","section"),renderTimeline([...t.events].reverse(),false),el("p","任务编号  "+t.id,"foot"));
}
function render(){
  $("featureTree").hidden=view!=="tree";$("board").hidden=view!=="board";$("activity").hidden=view!=="feed";
  $("mapTab").setAttribute("aria-pressed",String(view==="tree"));
  $("overview").setAttribute("aria-pressed",String(view==="board"));$("feed").setAttribute("aria-pressed",String(view==="feed"));
  $("pageTitle").textContent=view==="tree"?"Agent 功能树":view==="board"?"开发进度":"项目动态";
  if(view==="tree"){renderFeatureTree();return}
  if(view==="feed"){
    const events=tasks.flatMap(task=>task.events.map((e,index)=>({...e,task,index})))
      .sort((a,b)=>b.time.localeCompare(a.time)||(b.sequence??b.index)-(a.sequence??a.index));
    $("activity").replaceChildren(renderTimeline(events,true));return;
  }
  renderFilters();
  const visible=tasks.filter(t=>filter==="全部"||filter===t.state);
  if(revision>=0 && !visible.some(t=>t.id===selected))selected=visible[0]?.id||"";
  const list=$("tasks");list.replaceChildren();$("count").textContent=visible.length+" 项";
  for(const t of visible){
    const b=el("button",undefined,"row");b.type="button";b.setAttribute("aria-current",String(t.id===selected));
    const line=el("div",undefined,"rowline");line.append(el("span",t.group,"meta"),tag(t.state));
    b.append(line,el("strong",t.title));b.onclick=()=>{choose(t.id,true);$("tasks").querySelector('[aria-current=true]')?.focus({preventScroll:true})};list.append(b);
  }
  if(!visible.length)empty(list,"当前没有这类工作项。");
  renderDetail(visible.find(t=>t.id===selected));
}
$("mapTab").onclick=()=>{view="tree";setLocation("tree/"+encodeURIComponent(activeModule));render()};
$("overview").onclick=()=>{view="board";setLocation("board");render()};
$("feed").onclick=()=>{view="feed";setLocation("feed");render()};
window.addEventListener("hashchange",()=>{readLocation();render()});
let received=false;
window.receiveProgress=function(data){
  received=true;
  if(revision===data.revision)return;
  tasks=Object.entries(data.tasks).map(([id,entries])=>{
    const links=new Map();
    for(const e of entries)for(const l of e.links||[])links.set(l.url,l);
    const task={...Object.assign({},...entries),id,links:[...links.values()],events:entries};
    if(task.group==="盘中决策")task.group="盘中分析与决策";
    return task;
  }).sort((a,b)=>priority.indexOf(a.state)-priority.indexOf(b.state)||b.time.localeCompare(a.time)||a.title.localeCompare(b.title,"zh"));
  revision=data.revision;$("stamp").textContent="最近登记  "+formatTime(data.updated);render();
};
function reload(){
  received=false;const s=document.createElement("script");
  s.onload=s.onerror=()=>{
    $("sync").textContent=received?"自动更新":"读取异常";$("sync").classList.toggle("bad",!received);
    $("warning").hidden=received;
    if(!received)$("warning").textContent="暂时无法读取进度文件。请确认页面与“进度.js”在同一目录；页面会自动重试。";
    s.remove();setTimeout(reload,3000);
  };
  s.src="./进度.js?v="+Date.now();document.head.append(s);
}
readLocation();render();reload();
</script>
</body></html>
